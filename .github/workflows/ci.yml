name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit; Renovate updates the comment and SHA together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # api-diff needs tags to find the previous release.
          fetch-depth: 0

      # mise.toml is the single source of tool versions. This installs Go,
      # gofumpt and golangci-lint, then runs the same gate a developer runs
      # locally. apidiff, gorelease and govulncheck are pinned by their tasks.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          cache: true

      - name: check
        # Pre-1.0: api-diff reports incompatible changes without failing.
        # Set API_DIFF_STRICT=1 here after 1.0.
        env:
          API_DIFF_STRICT: "0"
        run: mise run check
