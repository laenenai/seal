name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit; Renovate updates the comment and SHA together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # api-diff needs tags to find the previous release.
          fetch-depth: 0

      # mise.toml is the single source of tool versions. This installs Go,
      # gofumpt and golangci-lint, then runs the same gate a developer runs
      # locally. apidiff, gorelease and govulncheck are pinned by their tasks.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true

      - name: check
        # Pre-1.0: api-diff reports incompatible changes without failing.
        # Set API_DIFF_STRICT=1 here after 1.0.
        env:
          API_DIFF_STRICT: "0"
        run: mise run check
