name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true

      # A tag is not a release until the same gate as main has passed on it.
      - name: check
        env:
          API_DIFF_STRICT: "0"
        run: mise run check

      # gorelease requires a clean tree and compares against the published
      # latest version. It is deliberately not in the dirty-branch gate.
      - name: gorelease
        run: |
          go run golang.org/x/exp/cmd/gorelease@v0.0.0-20261014143641-f0251eb4aa3e \
            -base=latest -version="${GITHUB_REF_NAME}"

      - name: create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: CHANGELOG.md
          generate_release_notes: false
          draft: false
          prerelease: false
