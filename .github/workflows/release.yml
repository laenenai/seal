name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true

      # A tag is not a release until the same gate as main has passed on it.
      - name: check
        env:
          API_DIFF_STRICT: "0"
        run: mise run check

      # gorelease requires a clean tree and compares against the published
      # latest version. It is deliberately not in the dirty-branch gate.
      - name: gorelease
        run: |
          go run golang.org/x/exp/cmd/gorelease@v0.0.0-20261014143641-f0251eb4aa3e \
            -base=latest -version="${GITHUB_REF_NAME}"

      - name: create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: CHANGELOG.md
          generate_release_notes: false
          draft: false
          prerelease: false
